# pyproject.toml - Modern Python Project Configuration
[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "ifactory"
version = "2.0.0"
description = "Equipment Realtime Visualization System"
readme = "docs/README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Industrial Engineering", email = "team@company.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Desktop Environment",
    "Framework :: PySide6",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
keywords = ["factory", "manufacturing", "visualization", "real-time", "equipment"]

dependencies = [
    # Core
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.23",
    "aiosqlite>=0.19.0",
    "aioodbc>=0.5.0",
    
    # UI
    "PySide6>=6.6.0",
    
    # Utilities
    "structlog>=23.2.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.9.10",
    
    # DI
    "dependency-injector>=4.41.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "hypothesis>=6.92.0",
    "freezegun>=1.2.2",
    
    # Code Quality
    "ruff>=0.1.8",
    "mypy>=1.7.1",
    "pre-commit>=3.6.0",
    
    # Type Stubs
    "types-python-dateutil>=2.8.19",
]

docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.2",
    "mkdocstrings[python]>=0.24.0",
]

[project.scripts]
ifactory = "iFactory.__main__:main"

[project.gui-scripts]
ifactory-gui = "iFactory.__main__:main"

[project.urls]
Homepage = "https://github.com/company/ifactory"
Documentation = "https://company.github.io/ifactory"
Repository = "https://github.com/company/ifactory"

# ============================================================================
# Tool Configurations
# ============================================================================

[tool.hatch.build.targets.wheel]
packages = ["src/iFactory"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/data/config",
    "/docs",
]

# Ruff - Ultra-fast Python linter
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # Pylint
    "RUF",    # Ruff-specific
    "ASYNC",  # flake8-async
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR2004",  # Magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["iFactory"]
force-single-line = false
lines-after-imports = 2

# MyPy - Static type checker
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "PySide6.*",
    "aioodbc.*",
]
ignore_missing_imports = true

# Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:dependency_injector.*",
]

[tool.coverage.run]
source = ["src/iFactory"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]